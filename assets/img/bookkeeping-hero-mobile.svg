<svg xmlns="http://www.w3.org/2000/svg" width="400" height="510" viewBox="0 0 400 510" role="img" aria-labelledby="title desc">
  <title id="title">See which jobs make money</title>
  <desc id="desc">A mobile-friendly bookkeeping summary with example gross profit and margins for three contractor jobs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#232B32"/><stop offset="1" stop-color="#111519"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="400" height="510" fill="url(#bg)"/>
  <rect width="400" height="510" fill="url(#grid)"/>
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="364" height="474" rx="8" fill="#F8F7F2"/>
    <path d="M26 18h348a8 8 0 0 1 8 8v49H18V26a8 8 0 0 1 8-8Z" fill="#14181C"/>
    <rect x="36" y="37" width="22" height="22" rx="4" fill="#F5B700"/>
    <path d="M42 48h10M47 43v10" stroke="#14181C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="48" fill="#F4F1EA" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">JOB COSTING SNAPSHOT</text>
    <text x="68" y="64" fill="#A9B1B8" font-family="Arial,sans-serif" font-size="11">MONTHLY BOOKKEEPING · EXAMPLE</text>

    <text x="38" y="104" fill="#6B7279" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".7">KNOW WHAT EACH JOB KEEPS</text>
    <text x="38" y="135" fill="#14181C" font-family="Arial,sans-serif" font-size="23" font-weight="700">See your profit clearly.</text>
    <text x="38" y="158" fill="#6B7279" font-family="Arial,sans-serif" font-size="13">Costs and margins, job by job.</text>

    <rect x="36" y="177" width="328" height="88" rx="5" fill="#FFF0B8"/>
    <text x="54" y="202" fill="#6B5A2C" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".6">GROSS PROFIT ACROSS 3 JOBS</text>
    <text x="54" y="246" fill="#14181C" font-family="Arial,sans-serif" font-size="37" font-weight="700">$9,450</text>
    <g transform="translate(280 204)">
      <rect x="0" y="25" width="12" height="20" rx="2" fill="#E6A900"/><rect x="18" y="15" width="12" height="30" rx="2" fill="#E6A900"/><rect x="36" y="4" width="12" height="41" rx="2" fill="#E6A900"/>
    </g>

    <text x="38" y="292" fill="#6B7279" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".8">RECENT JOBS · EXAMPLE MARGINS</text>
    <g font-family="Arial,sans-serif">
      <rect x="36" y="306" width="328" height="48" rx="3" fill="#fff"/>
      <text x="50" y="336" fill="#14181C" font-size="15" font-weight="700">Kitchen remodel</text>
      <rect x="285" y="316" width="63" height="28" rx="14" fill="#DDF2E5"/><text x="316.5" y="335" fill="#165C3B" font-size="14" font-weight="700" text-anchor="middle">26%</text>
      <path d="M36 354h328" stroke="#E2DDD1"/>
      <rect x="36" y="355" width="328" height="48" fill="#fff"/>
      <text x="50" y="385" fill="#14181C" font-size="15" font-weight="700">Deck build</text>
      <rect x="285" y="365" width="63" height="28" rx="14" fill="#DDF2E5"/><text x="316.5" y="384" fill="#165C3B" font-size="14" font-weight="700" text-anchor="middle">24%</text>
      <path d="M36 403h328" stroke="#E2DDD1"/>
      <rect x="36" y="404" width="328" height="48" fill="#fff"/>
      <text x="50" y="434" fill="#14181C" font-size="15" font-weight="700">Roof replacement</text>
      <rect x="285" y="414" width="63" height="28" rx="14" fill="#FCE8E4"/><text x="316.5" y="433" fill="#9B3325" font-size="14" font-weight="700" text-anchor="middle">−8%</text>
    </g>
    <path d="M36 465h328" stroke="#E2DDD1"/>
    <circle cx="43" cy="478" r="4" fill="#F5B700"/>
    <text x="54" y="482" fill="#6B7279" font-family="Arial,sans-serif" font-size="11">Illustrative figures · Based on your books</text>
  </g>
</svg>
